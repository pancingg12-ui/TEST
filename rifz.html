<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Scheduler Beta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-4 min-h-screen font-sans">

  <div class="max-w-md mx-auto space-y-5">
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Task Scheduler Pro</h1>
      <p class="text-xs text-slate-400">v1.0 Beta - Atur Alarm & Tugas Harian</p>
    </div>
    
    <!-- Form Input -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Judul Tugas</label>
        <input id="title" type="text" placeholder="Contoh: Rapat Penting / Minum Obat" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Pesan / Detail</label>
        <input id="message" type="text" placeholder="Waktunya kerjakan tugas ini!" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Jam Alarm (Format 24 Jam, Contoh: 14:30)</label>
        <input id="time" type="text" placeholder="14:30" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <button onclick="scheduleNotification()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 font-bold p-3 rounded-xl text-sm shadow-lg transition transform active:scale-95">
        Pasang Alarm Tugas ⏰
      </button>

      <button onclick="testNotification()" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 font-semibold p-2.5 rounded-xl text-xs border border-slate-700 transition">
        ⚡ Tes Alarm Sekarang (3 Detik)
      </button>
    </div>

    <!-- Status Info -->
    <div id="status" class="text-xs text-center text-amber-400 font-medium"></div>

    <!-- Daftar Tugas Aktif -->
    <div class="space-y-2">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Daftar Alarm Aktif:</h2>
      <div id="taskList" class="space-y-2"></div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", loadTasks);

    function getTasks() {
      return JSON.parse(localStorage.getItem('scheduled_tasks') || '[]');
    }

    function saveTasks(tasks) {
      localStorage.setItem('scheduled_tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      const listEl = document.getElementById('taskList');
      const tasks = getTasks();
      listEl.innerHTML = '';

      if (tasks.length === 0) {
        listEl.innerHTML = '<div class="text-xs text-slate-500 text-center py-4 bg-slate-900/50 rounded-xl border border-dashed border-slate-800">Belum ada alarm yang dipasang.</div>';
        return;
      }

      tasks.forEach((task, index) => {
        listEl.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center shadow">
            <div>
              <div class="text-sm font-bold text-white">${task.title}</div>
              <div class="text-xs text-slate-400">${task.message}</div>
              <div class="text-xs text-blue-400 font-semibold mt-1">🕒 Jam: ${task.time}</div>
            </div>
            <button onclick="deleteTask(${index})" class="text-red-400 hover:text-red-300 text-xs bg-red-950/40 border border-red-900/50 px-2.5 py-1.5 rounded-lg">Hapus</button>
          </div>
        `;
      });
    }

    function testNotification() {
      if (window.AndroidBridge && window.AndroidBridge.setAlarm) {
        window.AndroidBridge.setAlarm("Tes Alarm Pro", "Kringgg! Alarm berfungsi dengan suara & getar.", 3000);
        document.getElementById('status').innerText = 'Alarm tes disetel 3 detik lagi!';
      } else {
        alert('Bridge Android tidak aktif!');
      }
    }

    function scheduleNotification() {
      const title = document.getElementById('title').value.trim();
      const message = document.getElementById('message').value.trim();
      const timeVal = document.getElementById('time').value.trim();

      if (!title || !timeVal) {
        alert('Harap isi Judul dan Jam alarm!');
        return;
      }

      const timeRegex = /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/;
      if (!timeRegex.test(timeVal)) {
        alert('Format jam salah! Gunakan format HH:MM (Contoh: 14:30)');
        return;
      }

      const now = new Date();
      const parts = timeVal.split(':');
      const targetTime = new Date();
      targetTime.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);

      if (targetTime <= now) {
        targetTime.setDate(targetTime.getDate() + 1);
      }

      const delayMillis = targetTime.getTime() - now.getTime();

      if (window.AndroidBridge && window.AndroidBridge.setAlarm) {
        window.AndroidBridge.setAlarm(title, message, delayMillis);
        
        const tasks = getTasks();
        tasks.push({ title, message, time: timeVal });
        saveTasks(tasks);
        renderTasks();

        document.getElementById('status').innerText = `Sukses! Alarm diset untuk pukul ${timeVal}`;
        document.getElementById('title').value = '';
        document.getElementById('message').value = '';
        document.getElementById('time').value = '';
      } else {
        alert('Bridge Android tidak terdeteksi!');
      }
    }

    function deleteTask(index) {
      const tasks = getTasks();
      tasks.splice(index, 1);
      saveTasks(tasks);
      renderTasks();
      document.getElementById('status').innerText = 'Alarm dihapus.';
    }
  </script>
</body>
</html>
